name: signal6
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal6
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run 6-layer bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SIGNAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: state_signal6.json
          PASS_SCORE: "40"
          SIGNAL_MIN: "45"
          POST_TO_SQUARE: "true"
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_KEY }}
          SQUARE_EVERY_HOURS: "3"
        run: python signal6_bot.py --tick ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_signal6.json
          git diff --cached --quiet || (git commit -m "update signal6 state" && git pull --rebase && git push)
