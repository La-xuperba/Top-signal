name: Signals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = send real signals | dry-run = print only | test = send test message"
        default: "scan"
        type: choice
        options: [scan, dry-run, test]

concurrency:
  group: signals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_bot.py --${{ github.event.inputs.mode || 'scan' }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: state-${{ github.run_id }}
