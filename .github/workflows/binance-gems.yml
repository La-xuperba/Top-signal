name: BINANCE GEMS Early Pump Radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: binance-gems-early-pump
  cancel-in-progress: false

jobs:

  scan-and-publish:
    name: Scan Binance and Upload Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Early Pump Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          BINANCE_BASE_URL: https://data-api.binance.vision
          MIN_SCORE: "65"
          STRONG_SCORE: "80"
          MAX_24H_CHANGE_PCT: "15"
          VOLUME_RATIO_MIN: "1.5"
          RISK_PER_TRADE_PCT: "0.75"
          REFERENCE_CAPITAL_USD: "1000"
          MAX_WORKERS: "8"
        run: python binance_bot.py

      - name: Commit scan state and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json docs/data.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Early Pump Radar scan data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy dashboard to GitHub Pages
    needs: scan-and-publish
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
