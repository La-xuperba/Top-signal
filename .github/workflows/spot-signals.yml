name: BINANCE GEMS Spot Radar

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Resend signals even if already sent today"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-gems-spot-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: state_binance.json
          MIN_SCORE: "45"
          MAX_24H_CHANGE_PCT: "15"
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python binance_bot.py --watch 12 --force
          else
            python binance_bot.py --watch 12
          fi
      - name: Save duplicate-prevention state
        run: |
          if [ -f state_binance.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f state_binance.json
            git diff --cached --quiet || git commit -m "Update Binance Gems signal state"
            git push
          fi
